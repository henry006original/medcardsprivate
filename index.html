<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔒 MedCardPrivate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a120f;
    --surface:#111f1a;
    --surface2:#16281f;
    --text:#f0f0f6;
    --text-secondary:#66667a;
    --accent:#6366f1;
    --accent-dim:#6366f133;
    --success:#22c55e;
    --danger:#ef4444;
    --warning:#f97316;
    --radius:16px;
    --radius-sm:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Outfit',sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }
  #app{
    max-width:760px;
    margin:0 auto;
    padding:76px 16px 40px;
  }
  a{color:inherit;text-decoration:none;}
  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
    background:none;
    color:inherit;
  }
  input,textarea,select{
    font-family:inherit;
    background:var(--surface2);
    border:1px solid #2a2a3c;
    color:var(--text);
    border-radius:var(--radius-sm);
    padding:10px 12px;
    font-size:15px;
    outline:none;
    transition:border-color .15s;
  }
  input:focus,textarea:focus,select:focus{border-color:var(--accent);}
  textarea{resize:vertical;font-family:inherit;}

  /* Top nav */
  .topnav{
    position:fixed;top:0;left:0;right:0;
    height:60px;
    background:rgba(13,13,18,.9);
    backdrop-filter:blur(10px);
    border-bottom:1px solid #1f1f2e;
    display:flex;align-items:center;
    z-index:50;
  }
  .topnav-inner{
    max-width:760px;margin:0 auto;width:100%;
    padding:0 16px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .brand{
    font-weight:800;font-size:19px;letter-spacing:-.02em;
    display:flex;align-items:center;gap:8px;
    cursor:pointer;
  }
  .brand-dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 12px var(--accent);
  }
  .nav-link{
    color:var(--text-secondary);
    font-size:14px;font-weight:500;
    padding:8px 12px;border-radius:var(--radius-sm);
    transition:background .15s,color .15s;
  }
  .nav-link:hover{background:var(--surface2);color:var(--text);}

  .save-status{font-size:12px;color:var(--text-secondary);white-space:nowrap;}

  .streak-badge{
    display:inline-flex;align-items:center;gap:4px;
    font-size:13px;font-weight:700;
    padding:6px 10px;border-radius:999px;
    background:var(--surface2);color:var(--text-secondary);
    transition:background .2s,color .2s;
    white-space:nowrap;
  }
  .streak-badge.active{
    background:linear-gradient(135deg,#f9731633,#ef444433);
    color:#fdba74;
  }

  /* Breadcrumb */
  .breadcrumb{
    display:flex;align-items:center;flex-wrap:wrap;gap:4px;
    margin:0 0 20px;
    font-size:14px;color:var(--text-secondary);
  }
  .breadcrumb button{
    color:var(--text-secondary);
    padding:4px 6px;border-radius:6px;
    transition:color .15s,background .15s;
    max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .breadcrumb button:hover{color:var(--text);background:var(--surface2);}
  .breadcrumb .current{color:var(--text);font-weight:600;}
  .breadcrumb .sep{opacity:.5;}

  h1.page-title{font-size:26px;font-weight:700;margin:0 0 4px;letter-spacing:-.01em;}
  .page-sub{color:var(--text-secondary);font-size:14px;margin:0 0 20px;}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
  .btn{
    display:inline-flex;align-items:center;gap:7px;
    padding:10px 16px;border-radius:var(--radius-sm);
    font-size:14px;font-weight:600;
    transition:filter .15s, transform .1s;
    white-space:nowrap;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{filter:brightness(1.1);}
  .btn-ghost{background:var(--surface2);color:var(--text);}
  .btn-ghost:hover{filter:brightness(1.2);}
  .btn-success{background:var(--success);color:#08130a;}
  .btn-success:hover{filter:brightness(1.1);}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-danger:hover{filter:brightness(1.1);}
  .btn-warning{background:var(--warning);color:#1a0d02;}
  .btn-sm{padding:7px 12px;font-size:13px;border-radius:8px;}
  .btn-icon{padding:8px;border-radius:8px;background:var(--surface2);}
  .btn-icon:hover{filter:brightness(1.2);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  .empty-state{
    text-align:center;padding:60px 20px;color:var(--text-secondary);
  }
  .empty-state .emoji{font-size:44px;display:block;margin-bottom:14px;}
  .empty-state h3{color:var(--text);margin:0 0 6px;font-size:18px;}
  .empty-state p{margin:0 0 20px;font-size:14px;}

  /* Sort control */
  .sort-control{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .sort-control select{width:auto;}

  /* Cards list */
  .card-list{display:flex;flex-direction:column;gap:10px;}
  .item-row{
    background:var(--surface);
    border:1px solid #232333;
    border-radius:var(--radius);
    padding:14px 16px;
    display:flex;align-items:center;gap:12px;
    transition:border-color .15s, background .15s;
  }
  .item-row:hover{border-color:#33334a;background:var(--surface2);}
  .item-row.archived-row{opacity:.5;}
  .item-row[draggable="true"]{cursor:grab;}
  .item-row.dragging{opacity:.35;}
  .item-row.drag-over{outline:2px dashed var(--accent);}
  .item-row.drag-over.drop-before{box-shadow:inset 0 3px 0 0 var(--accent);}
  .item-row.drag-over.drop-after{box-shadow:inset 0 -3px 0 0 var(--accent);}
  .item-main{flex:1;min-width:0;cursor:pointer;display:flex;align-items:center;gap:12px;}
  .item-emoji{
    width:42px;height:42px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    font-size:20px;flex-shrink:0;
  }
  .item-text{min-width:0;}
  .item-title{font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .item-meta{font-size:12.5px;color:var(--text-secondary);margin-top:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .item-actions{display:flex;gap:6px;flex-shrink:0;}
  .accent-bar{width:4px;align-self:stretch;border-radius:4px;flex-shrink:0;}

  .card-preview-row .item-title{white-space:normal;}
  .card-preview-front{font-weight:600;font-size:15px;}
  .card-preview-back{font-size:13px;color:var(--text-secondary);margin-top:3px;}
  .card-thumb{width:42px;height:42px;border-radius:10px;object-fit:cover;flex-shrink:0;}
  .seen-toggle.seen{background:#22c55e22;color:#4ade80;}

  /* Badges */
  .badge{
    display:inline-flex;align-items:center;gap:3px;
    font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;
    white-space:nowrap;
  }
  .badge-correct{background:#22c55e22;color:#4ade80;}
  .badge-wrong{background:#f9731622;color:#fb923c;}

  /* Archived section */
  .archive-toggle{
    display:flex;align-items:center;gap:8px;
    color:var(--text-secondary);font-size:13.5px;font-weight:600;
    padding:12px 4px;margin-top:8px;
    width:100%;
    border-top:1px solid #201f2c;
  }
  .archive-toggle .chev{transition:transform .15s;font-size:11px;}
  .archive-toggle.open .chev{transform:rotate(90deg);}
  .archive-section{display:flex;flex-direction:column;gap:8px;margin-top:8px;}

  /* Modal */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.6);
    display:flex;align-items:center;justify-content:center;
    padding:16px;z-index:200;
    animation:fadeIn .15s ease;
  }
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .modal-box{
    background:var(--surface);
    border:1px solid #2a2a3c;
    border-radius:var(--radius);
    max-width:480px;width:100%;
    max-height:88vh;overflow-y:auto;
    padding:22px;
    animation:slideUp .18s ease;
  }
  @keyframes slideUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  .modal-title{font-size:18px;font-weight:700;margin:0 0 16px;}
  .form-group{margin-bottom:14px;}
  .form-label{display:block;font-size:13px;color:var(--text-secondary);margin-bottom:6px;font-weight:500;}
  .form-group input,.form-group textarea,.form-group select{width:100%;}
  .card-image-field{margin-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .card-image-preview{max-width:160px;max-height:120px;border-radius:10px;display:block;margin-top:8px;object-fit:cover;}
  .modal-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}
  .emoji-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .emoji-choice{
    width:38px;height:38px;border-radius:10px;background:var(--surface2);
    display:flex;align-items:center;justify-content:center;font-size:18px;
    border:2px solid transparent;
  }
  .emoji-choice.selected{border-color:var(--accent);}
  .color-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .color-choice{
    width:30px;height:30px;border-radius:50%;
    border:2px solid transparent;
  }
  .color-choice.selected{border-color:#fff;}
  .modal-danger-text{color:var(--text-secondary);font-size:14.5px;line-height:1.5;}
  .modal-danger-text b{color:var(--text);}

  /* Study mode */
  .study-topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:12px;}
  .study-stats{display:flex;gap:14px;font-size:13.5px;font-weight:600;}
  .stat-correct{color:var(--success);}
  .stat-wrong{color:var(--danger);}
  .progress-outer{
    height:6px;background:var(--surface2);border-radius:6px;overflow:hidden;margin-bottom:24px;
  }
  .progress-inner{height:100%;background:var(--accent);transition:width .25s ease;}
  .progress-label{font-size:12.5px;color:var(--text-secondary);margin-bottom:6px;display:flex;justify-content:space-between;}

  .flashcard{
    background:var(--surface);
    border:1px solid #262638;
    border-radius:20px;
    min-height:260px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:36px 24px;
    cursor:pointer;
    font-size:19px;font-weight:600;line-height:1.5;
    transition:border-color .15s;
    position:relative;
  }
  .flashcard:hover{border-color:var(--accent);}
  .flashcard.revealed{background:var(--surface2);cursor:default;}
  .flashcard .side-label{
    position:absolute;top:14px;left:18px;
    font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--text-secondary);font-weight:700;
  }
  .flashcard .tap-hint{
    position:absolute;bottom:14px;left:0;right:0;
    font-size:12px;color:var(--text-secondary);font-weight:400;
  }
  .flashcard .back-divider{width:40px;height:2px;background:var(--accent);margin:14px auto;border-radius:2px;}
  .flashcard-image{max-width:100%;max-height:220px;border-radius:12px;margin:10px 0;object-fit:contain;}
  .flashcard .front-recap{color:var(--text-secondary);font-size:15px;font-weight:500;}
  .flashcard .side-label-inline{position:static;display:block;margin-bottom:10px;}

  .study-actions{display:flex;gap:12px;margin-top:20px;}
  .study-actions .btn{flex:1;justify-content:center;padding:14px;font-size:15px;}
  .study-controls{display:flex;justify-content:center;gap:10px;margin-top:16px;flex-wrap:wrap;}

  .srs-actions{gap:8px;}
  .srs-btn{
    flex-direction:column;gap:2px;padding:12px 6px;font-size:13.5px;color:#fff;
  }
  .srs-preview{font-size:11.5px;font-weight:700;opacity:.85;}
  .srs-again{background:var(--danger);}
  .srs-again:hover{filter:brightness(1.1);}
  .srs-hard{background:var(--warning);}
  .srs-hard:hover{filter:brightness(1.1);}
  .srs-good{background:var(--success);color:#08130a;}
  .srs-good:hover{filter:brightness(1.1);}
  .srs-easy{background:#3b82f6;}
  .srs-easy:hover{filter:brightness(1.1);}
  @media(max-width:480px){ .srs-btn{font-size:12px;padding:10px 4px;} }

  .completion-box{text-align:center;padding:60px 20px;}
  .completion-emoji{font-size:56px;margin-bottom:16px;}
  .completion-title{font-size:24px;font-weight:800;margin-bottom:8px;}
  .completion-stats{display:flex;justify-content:center;gap:28px;margin:26px 0;}
  .completion-stat-num{font-size:28px;font-weight:800;}
  .completion-stat-label{font-size:12.5px;color:var(--text-secondary);margin-top:2px;}

  /* Import modal */
  .dropzone{
    border:2px dashed #33334a;border-radius:var(--radius-sm);
    padding:22px;text-align:center;color:var(--text-secondary);
    font-size:13.5px;cursor:pointer;transition:border-color .15s,background .15s;
  }
  .dropzone.dragover{border-color:var(--accent);background:var(--accent-dim);}
  .delim-shortcuts{display:flex;gap:8px;margin-top:8px;}
  .import-preview{
    margin-top:14px;background:var(--surface2);border-radius:var(--radius-sm);
    padding:12px;max-height:220px;overflow-y:auto;
  }
  .import-preview-summary{font-size:13.5px;font-weight:600;margin-bottom:8px;display:flex;gap:14px;}
  .import-preview-row{
    display:flex;gap:8px;font-size:13px;padding:6px 0;border-bottom:1px solid #262638;
  }
  .import-preview-row:last-child{border-bottom:none;}
  .import-preview-front{flex:1;color:var(--text);}
  .import-preview-back{flex:1;color:var(--text-secondary);}
  .import-invalid{color:var(--warning);font-size:12.5px;}

  @media(max-width:480px){
    .modal-box{padding:18px;}
    .flashcard{min-height:220px;font-size:17px;padding:26px 18px;}
    .study-actions .btn{padding:12px;font-size:14px;}
  }
</style>
</head>
<body>
<nav class="topnav">
  <div class="topnav-inner">
    <div class="brand" data-action="go-library"><span class="brand-dot"></span>🔒 MedCardPrivate</div>
    <div style="display:flex;align-items:center;gap:10px;">
      <span class="save-status" id="save-status"></span>
      <span class="streak-badge" id="streak-badge" title="Dias seguidos estudando">🔥 0</span>
      <button class="nav-link" id="owner-lock-btn" style="display:none;"></button>
      <a class="nav-link" data-action="go-library">Biblioteca</a>
    </div>
  </div>
</nav>
<div id="app"></div>
<div id="modal-root"></div>

<script>
(function(){
  "use strict";

  /* ---------------- Backend (Val Town) ---------------- */
  const API_BASE = 'https://henry006original--8baf8222903311f1b9d11607ee4eb77e.web.val.run';
  // 'private': this file's content lives in the private space, gated behind a PIN even to view.
  // 'public': content is readable by anyone; only writes require the PIN.
  const API_SPACE = 'private';

  let ownerPin = sessionStorage.getItem('mc_owner_pin') || null;
  let ownerMode = false;

  async function apiGetPublic(){
    const res = await fetch(API_BASE + '/public');
    if(!res.ok) throw new Error('load failed');
    return res.json();
  }
  async function apiReadPrivate(pin){
    const res = await fetch(API_BASE + '/private/read', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({pin})
    });
    if(res.status === 401){ const e = new Error('unauthorized'); e.code = 401; throw e; }
    if(!res.ok) throw new Error('load failed');
    return res.json();
  }
  async function apiVerifyPin(pin){
    const res = await fetch(API_BASE + '/verify-pin', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({pin})
    });
    return res.ok;
  }

  const OWNER_ONLY_ACTIONS = new Set([
    'new-folder','edit-folder','archive-folder','restore-folder','delete-folder',
    'new-card','edit-card','archive-card','restore-card','delete-card',
    'open-import','edit-study-card','quick-card','quick-import'
  ]);

  function updateOwnerLockBtn(){
    const btn = document.getElementById('owner-lock-btn');
    if(!btn) return;
    if(API_SPACE !== 'public'){ btn.style.display = 'none'; return; }
    btn.style.display = '';
    btn.textContent = ownerMode ? '🔓 Sair' : '🔐 Entrar';
    btn.title = ownerMode ? 'Sair do modo de edição' : 'Entrar como dono para editar';
  }

  function openPinModal(){
    openModal(`
      <div class="modal-title">🔐 Entrar como dono</div>
      <p class="modal-danger-text">Digite o PIN para poder criar e editar conteúdo. Sem o PIN, só dá para navegar e estudar.</p>
      <div class="form-group">
        <label class="form-label">PIN</label>
        <input type="password" id="f-pin" placeholder="Digite o PIN">
      </div>
      <p class="modal-danger-text" id="pin-error" style="display:none;color:var(--danger);">PIN incorreto.</p>
      <div class="modal-footer">
        <button class="btn btn-ghost" data-action="close-modal">Cancelar</button>
        <button class="btn btn-primary" id="confirm-pin-btn">Entrar</button>
      </div>
    `);
    const input = document.getElementById('f-pin');
    input.focus();
    const errorEl = document.getElementById('pin-error');
    async function trySubmit(){
      const val = input.value;
      if(!val) return;
      try{
        const ok = await apiVerifyPin(val);
        if(ok){
          ownerPin = val;
          sessionStorage.setItem('mc_owner_pin', val);
          ownerMode = true;
          updateOwnerLockBtn();
          closeModal();
          render();
        }else{
          errorEl.textContent = 'PIN incorreto.';
          errorEl.style.display = '';
          input.value = '';
          input.focus();
        }
      }catch(e){
        errorEl.textContent = 'Erro de conexão com o servidor — verifique sua internet e tente de novo.';
        errorEl.style.display = '';
      }
    }
    document.getElementById('confirm-pin-btn').addEventListener('click', trySubmit);
    input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') trySubmit(); });
  }

  function renderPinGate(errorMsg){
    appEl.innerHTML = `<div class="empty-state">
      <span class="emoji">🔒</span>
      <h3>Conteúdo privado</h3>
      <p>Digite o PIN para acessar.</p>
      <div class="form-group" style="max-width:280px;margin:0 auto 14px;text-align:left;">
        <input type="password" id="gate-pin" placeholder="PIN" style="text-align:center;">
      </div>
      ${errorMsg ? `<p style="color:var(--danger);font-size:13px;margin-bottom:14px;">${escapeHtml(errorMsg)}</p>` : ''}
      <button class="btn btn-primary" id="gate-submit">Entrar</button>
    </div>`;
    const input = document.getElementById('gate-pin');
    input.focus();
    const submit = ()=>{
      const val = input.value;
      if(!val) return;
      ownerPin = val;
      sessionStorage.setItem('mc_owner_pin', val);
      initApp();
    };
    document.getElementById('gate-submit').addEventListener('click', submit);
    input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') submit(); });
  }

  function showLoading(msg){
    appEl.innerHTML = `<div class="empty-state"><span class="emoji">⏳</span><p>${escapeHtml(msg||'Carregando…')}</p></div>`;
  }
  function showLoadError(msg){
    appEl.innerHTML = `<div class="empty-state">
      <span class="emoji">⚠️</span>
      <h3>Não foi possível carregar</h3>
      <p>${escapeHtml(msg)}</p>
      <button class="btn btn-primary" id="retry-load-btn">Tentar de novo</button>
    </div>`;
    document.getElementById('retry-load-btn').addEventListener('click', initApp);
  }

  async function initApp(){
    showLoading();
    if(API_SPACE === 'private' && !ownerPin){
      renderPinGate();
      return;
    }
    try{
      let data;
      if(API_SPACE === 'private'){
        data = await apiReadPrivate(ownerPin);
        ownerMode = true;
      }else{
        data = await apiGetPublic();
        ownerMode = false;
        if(ownerPin){
          const ok = await apiVerifyPin(ownerPin);
          if(ok) ownerMode = true;
          else { ownerPin = null; sessionStorage.removeItem('mc_owner_pin'); }
        }
      }
      state.root = { sortMode: data.rootSortMode || 'manual', folders: normalizeFolders(data) };
      applyLocalProgress(state.root.folders);
      applyLocalSeen(state.root.folders);
      state.streak = loadLocalStreak();
      view = { type:'library' };
      render();
      if(migrateSrs(state.root.folders)) saveContent();
    }catch(err){
      if(err && err.code === 401){
        ownerPin = null;
        sessionStorage.removeItem('mc_owner_pin');
        if(API_SPACE === 'private'){ renderPinGate('PIN incorreto.'); return; }
      }
      showLoadError('Verifique sua conexão com a internet e tente de novo.');
    }
  }

  /* ---------------- State (content lives on the server; only per-device study progress is local) ---------------- */
  // Hierarquia: Pasta (recursiva, pode ter subpastas e/ou cards em qualquer profundidade)
  let state = { root: { sortMode:'manual', folders: [] }, streak: { count: 0, lastDate: null } };

  // Legacy payloads used a fixed 3-level shape (modulos > disciplinas > aulas > cards).
  // Converts that into the generic folder tree on read; once anything is saved again
  // it's written back in the new {folders,rootSortMode} shape, so this only ever runs
  // against old data that hasn't been touched since the upgrade.
  function normalizeFolders(data){
    if(Array.isArray(data.folders)) return data.folders;
    const modulos = Array.isArray(data.modulos) ? data.modulos : [];
    return modulos.map(folderFromLegacyModulo);
  }
  function folderFromLegacyModulo(m){
    return {
      id: m.id, name: m.name, emoji: m.emoji, color: m.color, archived: !!m.archived, sortMode: 'manual',
      cards: [],
      folders: (m.disciplinas||[]).map(d => ({
        id: d.id, name: d.name, emoji: d.emoji, color: d.color, archived: !!d.archived, sortMode: 'manual',
        cards: [],
        folders: (d.aulas||[]).map(a => ({
          id: a.id, name: a.name, emoji: '📘', color: '#6366f1', archived: !!a.archived, sortMode: 'manual',
          cards: (a.cards||[]).slice(),
          folders: []
        }))
      }))
    };
  }

  function uid(){
    return 'id_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,10);
  }

  function forEachCard(folders, fn){
    folders.forEach(f=>{
      f.cards.forEach(fn);
      forEachCard(f.folders, fn);
    });
  }

  function loadLocalProgress(){
    try{ return JSON.parse(localStorage.getItem('mc_progress')) || {}; }catch(e){ return {}; }
  }
  let localProgress = loadLocalProgress();
  function saveLocalProgress(){ localStorage.setItem('mc_progress', JSON.stringify(localProgress)); }
  function applyLocalProgress(folders){
    forEachCard(folders, c=>{
      const p = localProgress[c.id];
      c.lastResult = p ? p.lastResult : null;
      c.lastStudiedAt = p ? p.lastStudiedAt : null;
    });
  }
  function setCardProgress(cardId, lastResult, lastStudiedAt){
    if(lastResult == null) delete localProgress[cardId];
    else localProgress[cardId] = { lastResult, lastStudiedAt };
    saveLocalProgress();
  }

  // "Já vi" is a manual bookmark, independent of study sessions/srs — just a
  // per-device flag so anyone (owner or not, no PIN needed) can mark a card as
  // reviewed without it ever touching the shared cloud content.
  function loadLocalSeen(){
    try{ return JSON.parse(localStorage.getItem('mc_seen')) || {}; }catch(e){ return {}; }
  }
  let localSeenStore = loadLocalSeen();
  function saveLocalSeenStore(){ localStorage.setItem('mc_seen', JSON.stringify(localSeenStore)); }
  function applyLocalSeen(folders){
    forEachCard(folders, c=>{ c.seen = !!localSeenStore[c.id]; });
  }
  function toggleCardSeen(cardId){
    const found = findCard(cardId);
    if(!found) return;
    const next = !found.card.seen;
    found.card.seen = next;
    if(next) localSeenStore[cardId] = true; else delete localSeenStore[cardId];
    saveLocalSeenStore();
    render();
  }

  // Unlike the public file, srs lives in the synced content itself here (this
  // file is already gated behind the owner PIN just to view, so there's no
  // "everyone answering collides in one schedule" problem to avoid).
  // Returns true if any card was missing srs and got migrated (caller should persist).
  function migrateSrs(folders){
    let migrated = false;
    forEachCard(folders, c=>{
      if(!c.srs){ c.srs = createSrs(); migrated = true; }
    });
    return migrated;
  }

  function loadLocalStreak(){
    try{ return JSON.parse(localStorage.getItem('mc_streak')) || { count:0, lastDate:null }; }catch(e){ return { count:0, lastDate:null }; }
  }
  function saveLocalStreak(){ localStorage.setItem('mc_streak', JSON.stringify(state.streak)); }

  function setSaveStatus(text, isError){
    const el = document.getElementById('save-status');
    if(!el) return;
    el.textContent = text;
    el.style.color = isError ? 'var(--danger)' : 'var(--text-secondary)';
    clearTimeout(setSaveStatus._t);
    if(text){
      setSaveStatus._t = setTimeout(()=>{ if(el.textContent===text) el.textContent=''; }, isError?4000:1500);
    }
  }

  // Coalescing save queue: rapid consecutive edits must never race over the
  // network and let a stale snapshot overwrite a newer one. At most one
  // request is ever in flight; each send captures state.root fresh at the
  // moment it actually goes out, and any edits queued up while a request was
  // in flight trigger exactly one more send with the latest state.
  let saveInFlight = false;
  let saveQueued = false;

  function saveContent(){
    saveQueued = true;
    if(saveInFlight) return;
    saveInFlight = true;
    (async()=>{
      while(saveQueued){
        saveQueued = false;
        await performSave();
      }
      saveInFlight = false;
    })();
  }

  async function performSave(){
    setSaveStatus('Salvando…');
    try{
      const cleanFolders = JSON.parse(JSON.stringify(state.root.folders));
      forEachCard(cleanFolders, c=>{
        c.lastResult = null; c.lastStudiedAt = null; c.seen = null;
      });
      const path = API_SPACE === 'public' ? '/public' : '/private/save';
      const res = await fetch(API_BASE + path, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ pin: ownerPin, data: { folders: cleanFolders, rootSortMode: state.root.sortMode } })
      });
      if(res.status === 401){
        setSaveStatus('⚠️ PIN inválido', true);
        ownerMode = false; ownerPin = null; sessionStorage.removeItem('mc_owner_pin');
        if(API_SPACE === 'private'){ renderPinGate('Sessão expirada — digite o PIN novamente.'); }
        else{ updateOwnerLockBtn(); render(); }
        return;
      }
      if(!res.ok) throw new Error('save failed');
      setSaveStatus('✓ Salvo');
    }catch(err){
      setSaveStatus('⚠️ Falha ao salvar — verifique a internet', true);
    }
  }

  /* ---------------- Helpers ---------------- */
  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }

  /* ---------------- Streak ---------------- */
  function pad2(n){ return n<10 ? '0'+n : ''+n; }
  function todayStr(){
    const d = new Date();
    return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
  }
  function dateOnly(str){
    const [y,m,d] = str.split('-').map(Number);
    return new Date(y, m-1, d);
  }
  function daysBetween(fromStr, toStr){
    return Math.round((dateOnly(toStr) - dateOnly(fromStr)) / 86400000);
  }
  function getDisplayStreak(){
    const s = state.streak;
    if(!s || !s.lastDate) return 0;
    const diff = daysBetween(s.lastDate, todayStr());
    if(diff >= 2) return 0;
    return s.count;
  }
  function registerStudyCompletion(){
    const today = todayStr();
    const s = state.streak;
    if(s.lastDate === today) return; // already counted today
    if(s.lastDate){
      const diff = daysBetween(s.lastDate, today);
      s.count = (diff === 1) ? s.count + 1 : 1;
    }else{
      s.count = 1;
    }
    s.lastDate = today;
    saveLocalStreak();
  }
  function renderStreakBadge(){
    const el = document.getElementById('streak-badge');
    if(!el) return;
    const n = getDisplayStreak();
    el.textContent = '🔥 ' + n;
    el.classList.toggle('active', n > 0);
  }

  function escapeHtml(str){
    return String(str==null?'':str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  /* ---------------- Folder / card lookup (generic recursive tree) ---------------- */
  function findFolder(folderId){
    function search(list, parent){
      for(const f of list){
        if(f.id === folderId) return { folder:f, parent, list };
        const found = search(f.folders, f);
        if(found) return found;
      }
      return null;
    }
    return search(state.root.folders, state.root);
  }
  function findFolderPath(folderId){
    function search(list, path){
      for(const f of list){
        if(f.id === folderId) return path.concat([f]);
        const sub = search(f.folders, path.concat([f]));
        if(sub) return sub;
      }
      return null;
    }
    return search(state.root.folders, []);
  }
  function findCard(cardId){
    function search(list){
      for(const f of list){
        const c = f.cards.find(x=>x.id===cardId);
        if(c) return { folder:f, card:c };
        const found = search(f.folders);
        if(found) return found;
      }
      return null;
    }
    return search(state.root.folders);
  }
  function allCardsUnder(folder){
    let out = folder.cards.slice();
    folder.folders.forEach(f=>{ out = out.concat(allCardsUnder(f)); });
    return out;
  }

  // Manual order is just live array order (rearranged in place by drag&drop).
  // Alphabetical/date views sort a display copy without touching that order,
  // so switching back to "Manual" always shows exactly what was last arranged.
  function idTimestamp(id){
    // Only ids from uid() (id_<base36 ts>_<rand>) carry a real timestamp — ids from
    // migrated legacy data (e.g. "mod1") don't, and must not be treated as one: base36
    // happily "parses" arbitrary text like "undefined" into a bogus huge number.
    const m = /^id_([0-9a-z]+)_/.exec(String(id));
    if(!m) return 0;
    const n = parseInt(m[1], 36);
    return isNaN(n) ? 0 : n;
  }
  function sortItems(list, sortMode, getKey){
    if(sortMode === 'alpha') return list.sort((a,b)=> getKey(a).localeCompare(getKey(b), 'pt-BR'));
    if(sortMode === 'created-asc') return list.sort((a,b)=> idTimestamp(a.id) - idTimestamp(b.id));
    if(sortMode === 'created-desc') return list.sort((a,b)=> idTimestamp(b.id) - idTimestamp(a.id));
    return list;
  }

  /* ---------- Card image upload: downscaled + re-encoded client-side before it
     ever becomes a data URI, since the raw photo from a phone camera would bloat
     the synced JSON document by megabytes for what's shown at a few hundred px. ---------- */
  function compressImageFile(file, maxDim, quality){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = (e)=>{
        const img = new Image();
        img.onload = ()=>{
          let { width, height } = img;
          if(width > maxDim || height > maxDim){
            if(width > height){ height = Math.round(height * maxDim / width); width = maxDim; }
            else { width = Math.round(width * maxDim / height); height = maxDim; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = ()=>reject(new Error('invalid image'));
        img.src = e.target.result;
      };
      reader.onerror = ()=>reject(new Error('read failed'));
      reader.readAsDataURL(file);
    });
  }

  function imageFieldInnerHtml(dataUrl){
    return `<input type="file" accept="image/*" style="display:none;">
      <button type="button" class="btn btn-sm btn-ghost" data-role="pick">${dataUrl?'🖼️ Trocar imagem':'🖼️ Adicionar imagem'}</button>
      ${dataUrl?`<button type="button" class="btn btn-sm btn-ghost" data-role="remove">✕ Remover imagem</button>`:''}
      ${dataUrl?`<img class="card-image-preview" src="${dataUrl}">`:''}`;
  }
  function imageFieldHtml(containerId, dataUrl){
    return `<div class="card-image-field" id="${containerId}">${imageFieldInnerHtml(dataUrl)}</div>`;
  }
  // onChange(dataUrl|null) fires whenever the user picks or removes an image;
  // the container re-renders itself so pick/remove keep working after a change.
  function wireImageField(containerId, initialUrl, onChange){
    const root = document.getElementById(containerId);
    let busy = false;
    function bind(){
      root.querySelector('[data-role="pick"]').addEventListener('click', ()=>{
        if(!busy) root.querySelector('input[type=file]').click();
      });
      const removeBtn = root.querySelector('[data-role="remove"]');
      if(removeBtn) removeBtn.addEventListener('click', ()=>{ onChange(null); root.innerHTML = imageFieldInnerHtml(null); bind(); });
      root.querySelector('input[type=file]').addEventListener('change', async (e)=>{
        const file = e.target.files[0];
        if(!file) return;
        busy = true;
        try{
          const dataUrl = await compressImageFile(file, 1000, 0.75);
          onChange(dataUrl);
          root.innerHTML = imageFieldInnerHtml(dataUrl);
        }catch(err){
          alert('Não foi possível carregar essa imagem.');
        }
        busy = false;
        bind();
      });
    }
    bind();
  }

        </div>
      </div>
      <div class="import-preview" id="import-preview"></div>
      <div class="modal-footer">
        <button class="btn btn-ghost" data-action="close-modal">Cancelar</button>
        <button class="btn btn-primary" id="confirm-import-btn" disabled>Importar cards</button>
      </div>
    `);

    const textArea = document.getElementById('f-import-text');
    const delimInput = document.getElementById('f-delim');
    const previewBox = document.getElementById('import-preview');
    const confirmBtn = document.getElementById('confirm-import-btn');
    let currentValid = [];

    function updatePreview(){
      const text = textArea.value;
      let delim = delimInput.value;
      if(delim === '') delim = '::';
      const lines = text.split(/\r?\n/);
      const valid = [];
      const invalid = [];
      lines.forEach((line, idx)=>{
        if(line.trim()==='') return;
        const parts = line.split(delim);
        if(parts.length >= 2){
          const front = parts[0].trim();
          const back = parts.slice(1).join(delim).trim();
          if(front && back){ valid.push({front,back}); return; }
        }
        invalid.push({num: idx+1, line});
      });
      currentValid = valid;
      confirmBtn.disabled = valid.length === 0;
      let html = `<div class="import-preview-summary"><span style="color:var(--success)">${valid.length} card(s) detectado(s)</span>${invalid.length?`<span class="import-invalid">${invalid.length} linha(s) ignorada(s)</span>`:''}</div>`;
      valid.slice(0,50).forEach(c=>{
        html += `<div class="import-preview-row"><div class="import-preview-front">${escapeHtml(c.front)}</div><div class="import-preview-back">${escapeHtml(c.back)}</div></div>`;
      });
      if(invalid.length){
        html += invalid.slice(0,10).map(l=>`<div class="import-invalid">Linha ${l.num} ignorada: "${escapeHtml(l.line.slice(0,60))}"</div>`).join('');
      }
      previewBox.innerHTML = html;
    }

    textArea.addEventListener('input', updatePreview);
    delimInput.addEventListener('input', updatePreview);
    document.querySelectorAll('[data-delim]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        delimInput.value = btn.dataset.delim === '\t' ? '\t' : btn.dataset.delim;
        updatePreview();
      });
    });

    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('f-file');
    dropzone.addEventListener('click', ()=>fileInput.click());
    fileInput.addEventListener('change', (e)=>{
      const file = e.target.files[0];
      if(file) readTextFile(file);
    });
    dropzone.addEventListener('dragover', (e)=>{ e.preventDefault(); dropzone.classList.add('dragover'); });
    dropzone.addEventListener('dragleave', ()=> dropzone.classList.remove('dragover'));
    dropzone.addEventListener('drop', (e)=>{
      e.preventDefault(); dropzone.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if(file) readTextFile(file);
    });
    function readTextFile(file){
      const reader = new FileReader();
      reader.onload = (ev)=>{
        textArea.value = ev.target.result;
        updatePreview();
      };
      reader.readAsText(file);
    }

    updatePreview();

    confirmBtn.addEventListener('click', ()=>{
      if(currentValid.length===0) return;
      currentValid.forEach(c=>{
        folder.cards.push({ id: uid(), front:c.front, back:c.back, frontImage:null, backImage:null, archived:false, lastResult:null, lastStudiedAt:null, srs: createSrs() });
      });
      saveContent(); closeModal();
      if(opts.onImported) opts.onImported(); else render();
    });
  }

  /* ---------- Export modal ---------- */
  function buildExportText(cards, delim){
    return cards.map(c=>{
      const front = c.front.replace(/\r?\n/g,' ');
      const back = c.back.replace(/\r?\n/g,' ');
      return front + delim + back;
    }).join('\n');
  }

          <button class="btn btn-sm btn-ghost" data-delim=";" type="button">;</button>
          <button class="btn btn-sm btn-ghost" data-delim="|" type="button">|</button>
          <button class="btn btn-sm btn-ghost" data-delim="::" type="button">::</button>

      </div>
    `);

    const delimInput = document.getElementById('f-export-delim');

    function refreshText(){
      let delim = delimInput.value;

    document.querySelectorAll('#modal-root [data-delim]').forEach(btn=>{

    downloadBtn.addEventListener('click', ()=>{

      const a = document.createElement('a');
      a.href = url;
      a.download = (label||'flashcards').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w\-]+/g,'_') + '.txt';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });

    const copyBtn = document.getElementById('copy-export-btn');
    copyBtn.addEventListener('click', ()=>{

        copyBtn.textContent = '✓ Copiado!';
        setTimeout(()=>{ if(copyBtn) copyBtn.textContent = '📋 Copiar'; }, 1500);
      };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(textArea.value).then(done).catch(()=>{ document.execCommand('copy'); done(); });
      }else{
        document.execCommand('copy'); done();

  /* ---------------- Spaced repetition (SM-2 style) ---------------- */
  const LEARNING_STEPS = [10/1440, 0.5];   // 10min, 12h
  const RELEARNING_STEPS = [10/1440];       // 10min
  const GRADUATING_INTERVAL_GOOD = 1;       // day
  const GRADUATING_INTERVAL_EASY = 4;       // days
  const DEFAULT_NEW_CARDS_PER_DAY = 9999;   // effectively unlimited unless the user sets a lower cap
  const DEFAULT_MAX_CARDS_PER_DAY = DEFAULT_NEW_CARDS_PER_DAY; // same "unlimited" sentinel
  const MIN_EASE = 1.3;
  const DAY_MS = 86400000;

  // User-adjustable "new cards per day" cap (global, not per-folder). Unlimited by default —
  // this only exists so the user can throttle themselves later if they want to, not to
  // silently hide cards they haven't studied yet.
  function loadNewCardsPerDaySetting(){
    const raw = localStorage.getItem('mc_new_per_day');
    const n = raw!==null ? parseInt(raw,10) : NaN;
    return (isNaN(n) || n<0) ? DEFAULT_NEW_CARDS_PER_DAY : n;
  }
  function saveNewCardsPerDaySetting(n){
    localStorage.setItem('mc_new_per_day', String(n));
  }

  // User-adjustable "max cards per day" cap (global, not per-folder): a ceiling on the
  // WHOLE deck (new + due) pulled per folder per day, independent of the new-cards cap.
  function loadMaxCardsPerDaySetting(){
    const raw = localStorage.getItem('mc_max_per_day');
    const n = raw!==null ? parseInt(raw,10) : NaN;
    return (isNaN(n) || n<0) ? DEFAULT_MAX_CARDS_PER_DAY : n;
  }
  function saveMaxCardsPerDaySetting(n){
    localStorage.setItem('mc_max_per_day', String(n));
  }

  function createSrs(){
    return { state:'new', ease:2.5, interval:0, reps:0, lapses:0, step:0, due: Date.now() };
  }
  function ensureCardSrs(card){
    if(!card.srs) card.srs = createSrs();
    return card.srs;
  }

  // Pure: given the current srs and a rating ('again'|'hard'|'good'|'easy'),
  // returns the NEXT srs object without mutating the input. Used both to
  // actually apply an answer and to preview the resulting interval on buttons.
  function computeNextSrs(srs, rating){
    const next = Object.assign({}, srs);
    const now = Date.now();

    if(next.state === 'new' || next.state === 'learning'){
      if(rating === 'again'){
        next.state = 'learning'; next.step = 0;
        next.due = now + LEARNING_STEPS[0] * DAY_MS;
      }else if(rating === 'hard'){
        next.state = 'learning';
        const stepDays = LEARNING_STEPS[next.step] !== undefined ? LEARNING_STEPS[next.step] : LEARNING_STEPS[LEARNING_STEPS.length-1];
        next.due = now + stepDays * DAY_MS;
      }else if(rating === 'good'){
        const nextStep = next.step + 1;
        if(nextStep < LEARNING_STEPS.length){
          next.state = 'learning'; next.step = nextStep;
          next.due = now + LEARNING_STEPS[nextStep] * DAY_MS;
        }else{
          next.state = 'review'; next.step = 0;
          next.interval = GRADUATING_INTERVAL_GOOD;
          next.reps += 1;
          next.due = now + next.interval * DAY_MS;
        }
      }else{ // easy
        next.state = 'review'; next.step = 0;
        next.interval = GRADUATING_INTERVAL_EASY;
        next.reps += 1;
        next.due = now + next.interval * DAY_MS;
      }
      return next;
    }

    if(next.state === 'relearning'){
      if(rating === 'again'){
        next.step = 0;
        next.due = now + RELEARNING_STEPS[0] * DAY_MS;
      }else if(rating === 'hard'){
        const stepDays = RELEARNING_STEPS[next.step] !== undefined ? RELEARNING_STEPS[next.step] : RELEARNING_STEPS[RELEARNING_STEPS.length-1];
        next.due = now + stepDays * DAY_MS;
      }else{ // good or easy: graduate back to review with a lapse penalty
        next.state = 'review'; next.step = 0;
        next.interval = Math.max(1, next.interval * 0.5);
        if(next.interval >= 1) next.interval = Math.ceil(next.interval);
        next.reps += 1;
        next.due = now + next.interval * DAY_MS;
      }
      return next;
    }

    // state === 'review'
    if(rating === 'again'){
      next.lapses += 1;
      next.ease = Math.max(MIN_EASE, next.ease - 0.2);
      next.state = 'relearning'; next.step = 0;
      next.due = now + RELEARNING_STEPS[0] * DAY_MS;
      // interval is intentionally left as-is; re-graduating halves it (see 'relearning' branch above)
      return next;
    }
    if(rating === 'hard'){
      next.ease = Math.max(MIN_EASE, next.ease - 0.15);
      next.interval = next.interval * 1.2;
    }else if(rating === 'good'){
      next.interval = next.interval * next.ease;
      next.reps += 1;
    }else{ // easy
      next.ease = next.ease + 0.15;
      next.interval = next.interval * next.ease * 1.3;
      next.reps += 1;
    }
    if(next.interval >= 1) next.interval = Math.ceil(next.interval);
    const fuzz = 1 + (Math.random()*0.1 - 0.05); // +/-5%
    next.due = now + next.interval * fuzz * DAY_MS;
    return next;
  }

  function formatInterval(days){
    if(days < 1/24){
      const mins = Math.max(1, Math.round(days * 1440));
      return mins + 'min';
    }
    if(days < 1){
      const hours = Math.max(1, Math.round(days * 24));
      return hours + 'h';
    }
    if(days < 30) return Math.round(days) + 'd';
    if(days < 365) return Math.round(days/30) + 'm';
    return Math.round(days/365) + 'a';
  }

  function previewIntervals(srs){
    const out = {};
    ['again','hard','good','easy'].forEach(rating=>{
      const next = computeNextSrs(srs, rating);
      const days = (next.due - Date.now()) / DAY_MS;
      out[rating] = formatInterval(Math.max(days, 1/1440));
    });
    return out;
  }

  /* ---------------- Study mode ---------------- */
  // Per-folder "new cards introduced today" counter (local, resets daily; matches Anki's per-deck new-card limit).
  function loadDailyNewCount(folderId){
    try{
      const raw = JSON.parse(localStorage.getItem('mc_srs_daily_'+folderId));
      if(raw && raw.date === todayStr()) return raw.count;
    }catch(e){}
    return 0;
  }
  function addDailyNewCount(folderId, n){
    if(n<=0) return;
    localStorage.setItem('mc_srs_daily_'+folderId, JSON.stringify({ date: todayStr(), count: loadDailyNewCount(folderId)+n }));
  }

  // Per-folder "total cards pulled into study today" counter (new + due combined;
  // matches Anki's overall daily deck limit, separate from the new-cards-only cap above).
  function loadDailyStudiedCount(folderId){
    try{
      const raw = JSON.parse(localStorage.getItem('mc_srs_studied_daily_'+folderId));
      if(raw && raw.date === todayStr()) return raw.count;
    }catch(e){}
    return 0;
  }
  function addDailyStudiedCount(folderId, n){
    if(n<=0) return;
    localStorage.setItem('mc_srs_studied_daily_'+folderId, JSON.stringify({ date: todayStr(), count: loadDailyStudiedCount(folderId)+n }));
  }

  function folderSrsStats(folder){
    const now = Date.now();
    const active = allCardsUnder(folder).filter(c=>!c.archived);
    active.forEach(c=>ensureCardSrs(c));
    return {
      paraRevisar: active.filter(c=>c.srs.state!=='new' && c.srs.due<=now).length,
      novos: active.filter(c=>c.srs.state==='new').length,
      aprendendo: active.filter(c=>c.srs.state==='learning'||c.srs.state==='relearning').length,
      noPrazo: active.filter(c=>c.srs.state==='review' && c.srs.due>now).length
    };
  }

  function openStudySettingsModal(){
    const current = loadNewCardsPerDaySetting();
    const isUnlimited = current >= DEFAULT_NEW_CARDS_PER_DAY;
    const currentMax = loadMaxCardsPerDaySetting();
    const isMaxUnlimited = currentMax >= DEFAULT_MAX_CARDS_PER_DAY;
    openModal(`
      <div class="modal-title">⚙️ Configurações de estudo</div>
      <div class="form-group">
        <label class="form-label">Cards novos por dia (revisão espaçada)</label>
        <input type="number" id="f-new-per-day" min="0" placeholder="Sem limite" value="${isUnlimited?'':current}">
        <p style="font-size:12px;color:var(--text-secondary);margin-top:6px;">Deixe em branco pra não ter limite (todos os cards novos entram na fila de uma vez). Coloque um número se quiser se auto-limitar, tipo Anki.</p>
      </div>
      <div class="form-group">
        <label class="form-label">Máximo de cartões por dia (novos + revisões)</label>
        <input type="number" id="f-max-per-day" min="0" placeholder="Sem limite" value="${isMaxUnlimited?'':currentMax}">
        <p style="font-size:12px;color:var(--text-secondary);margin-top:6px;">Teto geral do baralho por dia, somando novos e vencidos. Revisões vencidas sempre entram; se o teto apertar, quem fica de fora são os cards novos.</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" data-action="close-modal">Cancelar</button>
        <button class="btn btn-primary" id="save-study-settings-btn">Salvar</button>
      </div>
    `);
    document.getElementById('save-study-settings-btn').addEventListener('click', ()=>{
      const raw = document.getElementById('f-new-per-day').value.trim();
      const n = raw==='' ? DEFAULT_NEW_CARDS_PER_DAY : Math.max(0, parseInt(raw,10)||0);
      saveNewCardsPerDaySetting(n);
      const rawMax = document.getElementById('f-max-per-day').value.trim();
      const nMax = rawMax==='' ? DEFAULT_MAX_CARDS_PER_DAY : Math.max(0, parseInt(rawMax,10)||0);
      saveMaxCardsPerDaySetting(nMax);
      closeModal();
      render();
    });
  }

  // quickMode=true -> "Estudar tudo mesmo assim": binary Entendi/Ainda não,
  // never touches srs at all, so it never disturbs the spaced schedule.
  // quickMode falsy -> normal spaced-repetition study, due-filtered, SM-2 ratings.
  function startStudy(folderId, quickMode){
    const found = findFolder(folderId);
    if(!found) return;
    const activeCards = allCardsUnder(found.folder).filter(c=>!c.archived);
    if(activeCards.length===0) return;
    activeCards.forEach(c=>ensureCardSrs(c));

    let deck;
    if(quickMode){
      deck = shuffle(activeCards.map(c=>c.id));
    }else{
      const now = Date.now();
      const due = activeCards.filter(c=>c.srs.state!=='new' && c.srs.due<=now).sort((a,b)=>a.srs.due-b.srs.due);
      const newAllowance = Math.max(0, loadNewCardsPerDaySetting() - loadDailyNewCount(folderId));
      let fresh = activeCards.filter(c=>c.srs.state==='new').slice(0, newAllowance);

      // Overall daily cap (new + due combined): due reviews always win, so any
      // trimming needed to fit under the cap comes out of the new cards first.
      const maxAllowance = Math.max(0, loadMaxCardsPerDaySetting() - loadDailyStudiedCount(folderId));
      fresh = fresh.slice(0, Math.max(0, maxAllowance - due.length));

      if(fresh.length>0) addDailyNewCount(folderId, fresh.length);
      const combined = due.concat(fresh);
      if(combined.length>0) addDailyStudiedCount(folderId, combined.length);
      deck = combined.map(c=>c.id);
    }
    if(deck.length===0){ goFolder(folderId); return; } // nothing to study right now — show the folder view (stats/fallback button) instead of doing nothing

    session = {
      folderId,
      mode: quickMode ? 'quick' : 'spaced',
      round: 'main',
      deck,
      reviewDeck: [],
      hadReview: false,
      initialLength: deck.length,
      pos: 0,
      revealed: false,
      correctCount: 0,
      wrongCount: 0,
      done: false,
      history: []
    };
    view = {type:'study', folderId};
    render();
  }

  function currentSessionCard(){
    if(!session) return null;
    const id = session.deck[session.pos];
    if(!id) return null;
    return findCard(id);
  }

  function revealCard(){
    if(!session || session.done) return;
    session.revealed = true;
    render();
  }

  // input: rating string ('again'|'hard'|'good'|'easy') in spaced mode, or
  // boolean (true=Entendi, false=Ainda não) in quick mode.
  function answerCard(input){
    if(!session || session.done || !session.revealed) return;
    const cardId = session.deck[session.pos];
    const found = findCard(cardId);
    if(!found) return;
    const isQuick = session.mode === 'quick';
    const correct = input !== 'again'; // same 4-way rating in both modes; quick mode just skips touching srs below

    session.history.push({
      pos: session.pos,
      correctCount: session.correctCount, wrongCount: session.wrongCount,
      deck: session.deck.slice(), round: session.round, reviewDeck: session.reviewDeck.slice(),
      cardId,
      prevSrs: isQuick ? null : JSON.parse(JSON.stringify(found.card.srs)),
      prevResult: found.card.lastResult, prevStudiedAt: found.card.lastStudiedAt
    });

    if(!isQuick){
      const nextSrs = computeNextSrs(ensureCardSrs(found.card), input);
      found.card.srs = nextSrs;
      // Cards still mid learning/relearning reappear later in this same session.
      if(nextSrs.state === 'learning' || nextSrs.state === 'relearning') session.deck.push(cardId);
    }

    found.card.lastResult = correct ? 'correto' : 'errou';
    found.card.lastStudiedAt = todayStr();
    setCardProgress(cardId, found.card.lastResult, found.card.lastStudiedAt);
    if(correct) session.correctCount++; else session.wrongCount++;
    if(!isQuick) saveContent();

    if(isQuick && !correct && !session.reviewDeck.includes(cardId)) session.reviewDeck.push(cardId);

    session.pos++;
    session.revealed = false;
    if(session.pos >= session.deck.length){
      if(isQuick && session.round==='main' && session.reviewDeck.length>0){
        session.round = 'review';
        session.hadReview = true;
        session.deck = shuffle(session.reviewDeck);
        session.reviewDeck = [];
        session.pos = 0;
      }else{
        session.done = true;
        registerStudyCompletion();
      }
    }
    render();
  }

  function undoAnswer(){
    if(!session || session.history.length===0) return;
    const snap = session.history.pop();
    session.pos = snap.pos;
    session.revealed = false; // always show the front again, never jump back to the revealed back
    session.correctCount = snap.correctCount; session.wrongCount = snap.wrongCount;
    session.done = false;
    session.deck = snap.deck;
    session.round = snap.round;
    session.reviewDeck = snap.reviewDeck;
    const found = findCard(snap.cardId);
    if(found){
      if(snap.prevSrs) found.card.srs = snap.prevSrs;
      found.card.lastResult = snap.prevResult;
      found.card.lastStudiedAt = snap.prevStudiedAt;
    }
    setCardProgress(snap.cardId, snap.prevResult, snap.prevStudiedAt);
    if(session.mode==='spaced') saveContent();
    render();
  }

  function exitStudy(){
    session = null;
    goFolder(view.folderId);
  }

  function renderStudyView(){
    const found = findFolder(view.folderId);
    if(!found || !session){ goLibrary(); return; }
    const f = found.folder;
    const path = findFolderPath(view.folderId) || [f];

    let html = renderBreadcrumb(
      [{label:'Biblioteca', action:'go-library'}]
        .concat(path.map(p=>({label:p.name, action:'open-folder-'+p.id})))
        .concat([{label:'Estudar'}])
    );

    if(session.done){
      html += renderCompletionScreen(f);
      appEl.innerHTML = html;
      return;
    }

    const total = session.deck.length;
    const posDisplay = Math.min(session.pos+1, total);
    const pct = total? Math.round((session.pos/total)*100) : 0;

    const sc = currentSessionCard();
    const cardData = sc ? sc.card : null;

    const isQuick = session.mode === 'quick';
    const topLabel = isQuick
      ? (session.round==='review' ? 'Rodada de revisão (rápido)' : 'Estudando (rápido)')
      : 'Estudando (espaçado)';
    html += `<div class="study-topbar">
      <div class="page-title" style="font-size:19px;">${topLabel}</div>
      <div class="study-stats">
        <span class="stat-correct">✓ ${session.correctCount}</span>
        <span class="stat-wrong">✕ ${session.wrongCount}</span>
      </div>
    </div>`;
    html += `<div class="progress-label"><span>${posDisplay} / ${total}</span><span>${pct}%</span></div>`;
    html += `<div class="progress-outer"><div class="progress-inner" style="width:${pct}%"></div></div>`;

    if(cardData){
      if(!session.revealed){
        html += `<div class="flashcard" data-action="reveal-card">
          <span class="side-label">Pergunta</span>
          ${cardData.frontImage?`<img class="flashcard-image" src="${cardData.frontImage}">`:''}
          <div>${escapeHtml(cardData.front)}</div>
          <span class="tap-hint">Toque para revelar a resposta</span>
        </div>`;
      }else{
        html += `<div class="flashcard revealed">
          <span class="side-label">Pergunta</span>
          ${cardData.frontImage?`<img class="flashcard-image" src="${cardData.frontImage}">`:''}
          <div class="front-recap">${escapeHtml(cardData.front)}</div>
          <div class="back-divider"></div>
          <span class="side-label side-label-inline">Resposta</span>
          ${cardData.backImage?`<img class="flashcard-image" src="${cardData.backImage}">`:''}
          <div>${escapeHtml(cardData.back)}</div>
        </div>`;
      }
    }

    if(session.revealed && cardData){
      if(isQuick){
        // Quick mode is binary: Não entendi requeues the card into this
        // session's review round and never touches srs.
        html += `<div class="study-actions srs-actions quick-actions">
          <button class="btn srs-btn srs-again" data-action="srs-again">Não entendi</button>
          <button class="btn srs-btn srs-easy" data-action="srs-easy">Entendi</button>
        </div>`;
      }else{
        const preview = previewIntervals(ensureCardSrs(cardData));
        html += `<div class="study-actions srs-actions">
          <button class="btn srs-btn srs-again" data-action="srs-again">De novo${preview?`<span class="srs-preview">${preview.again}</span>`:''}</button>
          <button class="btn srs-btn srs-hard" data-action="srs-hard">Difícil${preview?`<span class="srs-preview">${preview.hard}</span>`:''}</button>
          <button class="btn srs-btn srs-good" data-action="srs-good">Bom${preview?`<span class="srs-preview">${preview.good}</span>`:''}</button>
          <button class="btn srs-btn srs-easy" data-action="srs-easy">Fácil${preview?`<span class="srs-preview">${preview.easy}</span>`:''}</button>
        </div>`;
      }
    }

    html += `<div class="study-controls">
      <button class="btn btn-ghost btn-sm" data-action="undo-answer" ${session.history.length===0?'disabled':''}>↩ Desfazer</button>
      ${cardData && ownerMode?`<button class="btn btn-ghost btn-sm" data-action="edit-study-card" data-id="${cardData.id}">✏️ Editar card</button>`:''}
      <button class="btn btn-ghost btn-sm" data-action="exit-study">Sair do estudo</button>
    </div>`;

    appEl.innerHTML = html;
  }

  function renderCompletionScreen(f){
    const hadRequeue = session.mode==='quick' ? session.hadReview : (session.deck.length > session.initialLength);
    const title = hadRequeue ? 'Revisão concluída!' : 'Deck completo!';
    const emoji = hadRequeue ? '🎯' : '🎉';
    return `<div class="completion-box">
      <div class="completion-emoji">${emoji}</div>
      <div class="completion-title">${title}</div>
      <p class="page-sub">Você concluiu o estudo de "${escapeHtml(f.name)}"</p>
      <div class="completion-stats">
        <div><div class="completion-stat-num" style="color:var(--success)">${session.correctCount}</div><div class="completion-stat-label">Acertos</div></div>
        <div><div class="completion-stat-num" style="color:var(--danger)">${session.wrongCount}</div><div class="completion-stat-label">Erros</div></div>
      </div>
      <div class="toolbar" style="justify-content:center;">
        <button class="btn btn-primary" data-action="restart-study" data-id="${f.id}" data-mode="${session.mode}">🔁 Estudar novamente</button>
        <button class="btn btn-ghost" data-action="exit-study">Voltar à pasta</button>
      </div>
    </div>`;
  }

  /* ---------------- Drag & drop: cards move into a folder shown in the same
     view; both cards and folders can be dragged onto a sibling row to reorder
     (which switches that list to "Manual" sort so the new order sticks). ---------- */
  let dragPayload = null;

  function handleDrop(payload, targetRow, before){
    if(payload.type === 'card'){
      const src = findCard(payload.id);
      if(!src) return;
      if(targetRow.dataset.dropFolder){
        const destFound = findFolder(targetRow.dataset.dropFolder);
        if(!destFound) return;
        src.folder.cards = src.folder.cards.filter(c=>c.id!==payload.id);
        destFound.folder.cards.push(src.card);
        saveContent(); render();
        return;
      }
      if(targetRow.dataset.dragType === 'card'){
        const targetId = targetRow.dataset.dragId;
        if(targetId === payload.id) return;
        const list = src.folder.cards;
        const fromIdx = list.findIndex(c=>c.id===payload.id);
        if(fromIdx===-1) return;
        list.splice(fromIdx,1);
        let insertAt = list.findIndex(c=>c.id===targetId);
        if(insertAt===-1){ list.splice(fromIdx,0,src.card); return; } // target wasn't a sibling — leave untouched
        insertAt += before ? 0 : 1;
        list.splice(insertAt,0,src.card);
        src.folder.sortMode = 'manual';
        saveContent(); render();
      }
      return;
    }
    if(payload.type === 'folder'){
      if(payload.id === targetRow.dataset.dragId) return;
      const src = findFolder(payload.id);
      if(!src) return;
      const targetFolderId = targetRow.dataset.dropFolder;
      if(!targetFolderId) return;
      const destFound = findFolder(targetFolderId);
      if(!destFound || destFound.list !== src.list) return; // only reorder among siblings, never re-parent
      const list = src.list;
      const fromIdx = list.findIndex(x=>x.id===payload.id);
      if(fromIdx===-1) return;
      list.splice(fromIdx,1);
      let insertAt = list.findIndex(x=>x.id===targetFolderId);
      if(insertAt===-1){ list.splice(fromIdx,0,src.folder); return; }
      insertAt += before ? 0 : 1;
      list.splice(insertAt,0,src.folder);
      if(src.parent) src.parent.sortMode = 'manual';
      saveContent(); render();
    }
  }

  document.addEventListener('dragstart', (e)=>{
    const row = e.target.closest('[data-drag-id]');
    if(!row || !ownerMode){ if(row) e.preventDefault(); return; }
    dragPayload = { type: row.dataset.dragType, id: row.dataset.dragId };
    e.dataTransfer.setData('text/plain', JSON.stringify(dragPayload));
    e.dataTransfer.effectAllowed = 'move';
    row.classList.add('dragging');
  });
  document.addEventListener('dragend', ()=>{
    document.querySelectorAll('.dragging').forEach(el=>el.classList.remove('dragging'));
    document.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over','drop-before','drop-after'));
    dragPayload = null;
  });
  document.addEventListener('dragover', (e)=>{
    if(!ownerMode || !dragPayload) return;
    const row = e.target.closest('[data-drop-folder], [data-drag-type]');
    if(!row) return;
    e.preventDefault();
    document.querySelectorAll('.drag-over').forEach(el=>{ if(el!==row) el.classList.remove('drag-over','drop-before','drop-after'); });
    row.classList.add('drag-over');
    const rect = row.getBoundingClientRect();
    const before = (e.clientY - rect.top) < rect.height/2;
    row.classList.toggle('drop-before', before);
    row.classList.toggle('drop-after', !before);
  });
  document.addEventListener('dragleave', (e)=>{
    const row = e.target.closest('[data-drop-folder], [data-drag-type]');
    if(row && (!e.relatedTarget || !row.contains(e.relatedTarget))) row.classList.remove('drag-over','drop-before','drop-after');
  });
  document.addEventListener('drop', (e)=>{
    if(!ownerMode) return;
    const row = e.target.closest('[data-drop-folder], [data-drag-type]');
    if(!row) return;
    e.preventDefault();
    const rect = row.getBoundingClientRect();
    const before = (e.clientY - rect.top) < rect.height/2;
    row.classList.remove('drag-over','drop-before','drop-after');
    let payload = dragPayload;
    if(!payload){
      try{ payload = JSON.parse(e.dataTransfer.getData('text/plain')); }catch(err){ payload = null; }
    }
    dragPayload = null;
    if(!payload || !payload.id) return;
    handleDrop(payload, row, before);
  });

  /* ---------------- Event delegation ---------------- */
  document.addEventListener('click', (e)=>{
    const btn = e.target.closest('[data-action]');
    if(!btn) return;
    const action = btn.dataset.action;
    const id = btn.dataset.id;

    if(OWNER_ONLY_ACTIONS.has(action) && !ownerMode) return;

    switch(action){
      case 'go-library': goLibrary(); break;
      case 'noop': break;

      case 'quick-card': quickNewCard(); break;
      case 'quick-import': quickImportCards(); break;

      case 'new-folder': {
        if(id){
          const found = findFolder(id);
          if(found) openFolderModal(found.folder.folders, null);
        }else{
          openFolderModal(state.root.folders, null);
        }
        break;
      }
      case 'edit-folder': {
        const found = findFolder(id);
        if(found) openFolderModal(found.list, found.folder);
        break;
      }
      case 'archive-folder': {
        const found = findFolder(id);
        if(found){ found.folder.archived = true; saveContent(); render(); }
        break;
      }
      case 'restore-folder': {
        const found = findFolder(id);
        if(found){ found.folder.archived = false; saveContent(); render(); }
        break;
      }
      case 'delete-folder': {
        const found = findFolder(id);
        if(found) openConfirmModal(`Tem certeza que deseja excluir permanentemente a pasta <b>${escapeHtml(found.folder.name)}</b> e todo o seu conteúdo (subpastas e cards)? Essa ação não pode ser desfeita.`, ()=>{
          found.list.splice(found.list.indexOf(found.folder), 1);
          saveContent();
        });
        break;
      }
      case 'open-folder': goFolder(id); break;

      case 'new-card': {
        const found = findFolder(id);
        if(found) openCardModal(found.folder, null);
        break;
      }
      case 'edit-card': {
        const found = findCard(id);
        if(found) openCardModal(found.folder, found.card);
        break;
      }
      case 'archive-card': {
        const found = findCard(id);
        if(found){ found.card.archived = true; saveContent(); render(); }
        break;
      }
      case 'restore-card': {
        const found = findCard(id);
        if(found){ found.card.archived = false; saveContent(); render(); }
        break;
      }
      case 'delete-card': {
        const found = findCard(id);
        if(found) openConfirmModal(`Tem certeza que deseja excluir permanentemente este card? Essa ação não pode ser desfeita.`, ()=>{
          found.folder.cards = found.folder.cards.filter(x=>x.id!==id);
          saveContent();
        });
        break;
      }

      case 'open-import': {
        const found = findFolder(id);
        if(found) openImportModal(found.folder);
        break;
      }

      case 'reset-folder': {
        const found = findFolder(id);
        if(found) openResetConfirmModal(`Resetar o progresso de estudo de todos os cards da pasta <b>${escapeHtml(found.folder.name)}</b> (incluindo subpastas)? O histórico de acertos/erros e o agendamento de revisão espaçada serão reiniciados. Essa ação não pode ser desfeita.`, ()=>{
          resetCardsProgress(allCardsUnder(found.folder));
        });
        break;
      }
      case 'reset-card': {
        const found = findCard(id);
        if(found) openResetConfirmModal(`Resetar o progresso de estudo deste card? O histórico de acerto/erro e o agendamento de revisão espaçada dele serão reiniciados. Essa ação não pode ser desfeita.`, ()=>{
          resetCardsProgress([found.card]);
        });
        break;
      }
      case 'toggle-seen': toggleCardSeen(id); break;

      case 'open-study-settings': openStudySettingsModal(); break;

      case 'export-folder': {
        const found = findFolder(id);
        if(found) openExportModal(allCardsUnder(found.folder).filter(c=>!c.archived), found.folder.name);
        break;
      }

      case 'start-study': startStudy(id); break;
      case 'restart-study': startStudy(id, btn.dataset.mode==='quick'); break;
      case 'study-all': startStudy(id, true); break;
      case 'reveal-card': revealCard(); break;
      case 'srs-again': answerCard('again'); break;
      case 'srs-hard': answerCard('hard'); break;
      case 'srs-good': answerCard('good'); break;
      case 'srs-easy': answerCard('easy'); break;
      case 'undo-answer': undoAnswer(); break;
      case 'exit-study': exitStudy(); break;
      case 'edit-study-card': {
        const found = findCard(id);
        if(found) openCardModal(found.folder, found.card, { onSaved: ()=>render() });
        break;
      }

      case 'close-modal': closeModal(); break;
      case 'modal-overlay-click': break;

      default:
        if(action.startsWith('open-folder-')){ goFolder(action.replace('open-folder-','')); }
        break;
    }
  });

  document.addEventListener('click', (e)=>{
    const toggle = e.target.closest('[data-action="toggle-archive"]');
    if(!toggle) return;
    const key = toggle.dataset.key;
    uiState.openArchives[key] = !uiState.openArchives[key];
    render();
  });

  document.addEventListener('change', (e)=>{
    const sel = e.target.closest('[data-action="set-sort-mode"]');
    if(!sel || !ownerMode) return;
    const targetId = sel.dataset.id;
    if(targetId === 'root'){
      state.root.sortMode = sel.value;
    }else{
      const found = findFolder(targetId);
      if(!found) return;
      found.folder.sortMode = sel.value;
    }
    saveContent(); render();
  });

  // Keyboard shortcuts during study: Space = reveal (same as tapping the card),
  // 1/2/3/4 = De novo/Difícil/Bom/Fácil once revealed (spaced mode), or
  // 1/2 = Não entendi/Entendi once revealed (quick mode).
  document.addEventListener('keydown', (e)=>{
    if(view.type !== 'study' || !session) return;
    if(e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    if(modalRoot.children.length>0) return;
    if(e.key===' '){
      e.preventDefault();
      if(!session.revealed) revealCard();
      return;
    }
    if(session.revealed){
      if(session.mode==='quick'){
        if(e.key==='1') answerCard('again');
        else if(e.key==='2') answerCard('easy');
      }else{
        if(e.key==='1') answerCard('again');
        else if(e.key==='2') answerCard('hard');
        else if(e.key==='3') answerCard('good');
        else if(e.key==='4') answerCard('easy');
      }
    }
  });

  document.getElementById('owner-lock-btn').addEventListener('click', ()=>{
    if(API_SPACE !== 'public') return;
    if(ownerMode){
      ownerMode = false; ownerPin = null; sessionStorage.removeItem('mc_owner_pin');
      updateOwnerLockBtn(); render();
    }else{
      openPinModal();
    }
  });

  /* ---------------- Init ---------------- */
  updateOwnerLockBtn();
  initApp();
})();
</script>
</body>
</html>
